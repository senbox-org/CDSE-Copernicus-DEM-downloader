name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install regex requests colorlog lxml pykml antimeridian shapely pyyaml rsa ruff
      - run: ruff check --select F .
      - run: python -m unittest test_cdse_copernicus_dem_downloader
        working-directory: cdse-copernicus-dem-downloader
